<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MonoNote 桌面端笔记原型</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-sans, "Segoe UI Variable", "Microsoft YaHei UI", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif);
    color: var(--foreground, #231f1b);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .preview-stage {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Minimal T3-themed interactive control strip */
  .control-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 2px;
  }

  .control-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
  }

  .ctrl-pill {
    appearance: none;
    border: 1px solid var(--border, rgba(120, 110, 96, 0.25));
    background: var(--card, rgba(255, 255, 255, 0.06));
    color: var(--muted-foreground, var(--foreground, inherit));
    font-family: var(--font-sans, inherit);
    font-size: 11.5px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: var(--radius, 8px);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
  }

  .ctrl-pill:hover {
    border-color: var(--ring, rgba(194, 109, 74, 0.5));
    color: var(--foreground, inherit);
    background: var(--secondary, rgba(120, 110, 96, 0.14));
  }

  .ctrl-pill.is-active {
    background: var(--secondary, rgba(194, 109, 74, 0.16));
    color: var(--foreground, inherit);
    border-color: var(--ring, rgba(194, 109, 74, 0.55));
    font-weight: 600;
  }

  /* MonoNote Desktop App Window Prototype */
  .mononote-window {
    --v-ambient-1: #EFE6D8;
    --v-ambient-2: #E2D9CB;
    --v-orb-1: rgba(214, 126, 86, 0.36);
    --v-orb-2: rgba(110, 158, 134, 0.26);
    --v-orb-3: rgba(218, 184, 130, 0.30);
    --v-paper: rgba(252, 251, 248, 0.96);
    --v-card: #F5F1E9;
    --v-card-hover: #EFE9DD;
    --v-glass: rgba(248, 245, 239, 0.66);
    --v-glass-strong: rgba(251, 249, 245, 0.80);
    --v-glass-highlight: rgba(255, 255, 255, 0.82);
    --v-border: rgba(58, 48, 38, 0.09);
    --v-border-strong: rgba(58, 48, 38, 0.16);
    --v-ink: #231F1B;
    --v-ink-2: #655D55;
    --v-ink-3: #999086;
    --v-accent: #C26D4A;
    --v-accent-soft: rgba(194, 109, 74, 0.13);
    --v-sage: #4B7562;
    --v-sage-soft: rgba(75, 117, 98, 0.13);
    --v-slate: #4F6882;
    --v-code-bg: #EFE9DE;
    --v-shadow-paper: 0 2px 12px rgba(40, 32, 22, 0.06), 0 1px 2px rgba(40, 32, 22, 0.04);
    --v-shadow-float: 0 16px 38px rgba(34, 26, 18, 0.15), 0 2px 8px rgba(34, 26, 18, 0.06);
    --v-shadow-window: 0 18px 46px rgba(24, 18, 12, 0.18), 0 0 0 1px rgba(58, 48, 38, 0.12);

    position: relative;
    width: 100%;
    height: 604px;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--v-ink);
    background: linear-gradient(145deg, var(--v-ambient-1), var(--v-ambient-2));
    box-shadow: var(--v-shadow-window);
    transition: color 240ms ease, background 260ms ease;
    user-select: none;
  }

  .mononote-window.theme-dark {
    --v-ambient-1: #161311;
    --v-ambient-2: #100E0C;
    --v-orb-1: rgba(217, 132, 94, 0.24);
    --v-orb-2: rgba(96, 148, 124, 0.18);
    --v-orb-3: rgba(164, 134, 92, 0.16);
    --v-paper: rgba(28, 25, 23, 0.96);
    --v-card: #25221E;
    --v-card-hover: #2C2823;
    --v-glass: rgba(34, 30, 27, 0.66);
    --v-glass-strong: rgba(39, 35, 31, 0.84);
    --v-glass-highlight: rgba(255, 245, 232, 0.09);
    --v-border: rgba(255, 245, 232, 0.09);
    --v-border-strong: rgba(255, 245, 232, 0.18);
    --v-ink: #EDE8E1;
    --v-ink-2: #A69D92;
    --v-ink-3: #756D63;
    --v-accent: #D98A68;
    --v-accent-soft: rgba(217, 138, 104, 0.18);
    --v-sage: #78A890;
    --v-sage-soft: rgba(120, 168, 144, 0.16);
    --v-slate: #83A0BE;
    --v-code-bg: #141210;
    --v-shadow-paper: 0 4px 16px rgba(0, 0, 0, 0.28), 0 1px 2px rgba(0, 0, 0, 0.2);
    --v-shadow-float: 0 16px 38px rgba(0, 0, 0, 0.48), 0 2px 8px rgba(0, 0, 0, 0.28);
    --v-shadow-window: 0 20px 50px rgba(0, 0, 0, 0.48), 0 0 0 1px rgba(255, 245, 232, 0.12);
  }

  /* Ambient Orbs behind frosted glass panels */
  .ambient-orbs {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .orb {
    position: absolute;
    border-radius: 999px;
    filter: blur(42px);
  }
  .orb-1 {
    width: 240px;
    height: 240px;
    top: -40px;
    left: -30px;
    background: var(--v-orb-1);
  }
  .orb-2 {
    width: 220px;
    height: 220px;
    bottom: -30px;
    left: 60px;
    background: var(--v-orb-2);
  }
  .orb-3 {
    width: 260px;
    height: 180px;
    top: -50px;
    right: 60px;
    background: var(--v-orb-3);
  }

  /* Unified Frameless Titlebar */
  .titlebar {
    position: relative;
    height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 8px 0 10px;
    background: var(--v-glass);
    backdrop-filter: blur(24px) saturate(145%);
    -webkit-backdrop-filter: blur(24px) saturate(145%);
    border-bottom: 1px solid var(--v-border);
    box-shadow: inset 0 1px 0 var(--v-glass-highlight);
    z-index: 15;
  }

  .titlebar-left {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .traffic-lights {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 0 6px 0 2px;
    flex-shrink: 0;
  }
  .mononote-window.os-mac .traffic-lights {
    display: flex;
  }
  .mononote-window.os-mac .win-controls {
    display: none;
  }
  .mononote-window.os-mac .brand-mark {
    display: none;
  }

  .tl-dot {
    width: 11px;
    height: 11px;
    border-radius: 999px;
    border: 0.5px solid rgba(0, 0, 0, 0.14);
  }
  .tl-red { background: #FF5F57; }
  .tl-yellow { background: #FEBC2E; }
  .tl-green { background: #28C840; }

  .brand-mark {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--v-accent), #A75434);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(194, 109, 74, 0.30);
  }

  .icon-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--v-ink-2);
    width: 26px;
    height: 26px;
    border-radius: 7px;
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 120ms ease, color 120ms ease;
  }
  .icon-btn:hover {
    background: var(--v-accent-soft);
    color: var(--v-ink);
  }
  .icon-btn.is-active {
    background: var(--v-accent-soft);
    color: var(--v-accent);
  }

  /* Integrated Compact Tabs */
  .tabs-strip {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    overflow: hidden;
  }

  .doc-tab {
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--v-ink-2);
    height: 27px;
    max-width: 158px;
    padding: 0 7px 0 8px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
    flex-shrink: 1;
    min-width: 0;
  }

  .doc-tab span.tab-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .doc-tab:hover {
    background: rgba(128, 118, 106, 0.10);
    color: var(--v-ink);
  }

  .doc-tab.is-active {
    background: var(--v-paper);
    color: var(--v-ink);
    border-color: var(--v-border);
    box-shadow: 0 1px 3px rgba(34, 26, 18, 0.06);
  }

  .tab-close {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    display: inline-grid;
    place-items: center;
    font-size: 11px;
    line-height: 1;
    opacity: 0.45;
    flex-shrink: 0;
  }
  .doc-tab:hover .tab-close,
  .doc-tab.is-active .tab-close {
    opacity: 0.72;
  }
  .tab-close:hover {
    background: rgba(128, 118, 106, 0.16);
    opacity: 1 !important;
  }

  /* Centered Search Capsule */
  .search-pill {
    appearance: none;
    height: 27px;
    min-width: 162px;
    padding: 0 8px 0 10px;
    border-radius: 999px;
    border: 1px solid var(--v-border);
    background: var(--v-glass-strong);
    box-shadow: inset 0 1px 0 var(--v-glass-highlight);
    color: var(--v-ink-2);
    font-family: inherit;
    font-size: 11.5px;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 140ms ease, background 140ms ease;
  }

  .search-pill:hover {
    border-color: var(--v-border-strong);
    color: var(--v-ink);
  }

  .search-pill-left {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .kbd-badge {
    font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 5px;
    background: rgba(128, 118, 106, 0.12);
    color: var(--v-ink-2);
    border: 1px solid var(--v-border);
    line-height: 1.3;
  }

  .titlebar-right {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }

  .win-controls {
    display: flex;
    align-items: center;
    margin-left: 4px;
    border-left: 1px solid var(--v-border);
    padding-left: 4px;
  }

  .win-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--v-ink-2);
    width: 28px;
    height: 26px;
    border-radius: 6px;
    display: inline-grid;
    place-items: center;
    font-size: 11px;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .win-btn:hover {
    background: rgba(128, 118, 106, 0.12);
    color: var(--v-ink);
  }
  .win-btn.win-close:hover {
    background: #C42B1C;
    color: #fff;
  }

  /* Workspace Main Body */
  .workspace-body {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    padding: 8px;
    gap: 8px;
    z-index: 1;
  }

  /* Collapsible Floating Frosted Sidebar */
  .floating-sidebar {
    width: 196px;
    flex-shrink: 0;
    border-radius: 12px;
    background: var(--v-glass);
    backdrop-filter: blur(26px) saturate(150%);
    -webkit-backdrop-filter: blur(26px) saturate(150%);
    border: 1px solid var(--v-border);
    box-shadow: inset 0 1px 0 var(--v-glass-highlight), 0 6px 20px rgba(34, 26, 18, 0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 260ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 200ms ease,
                margin 260ms cubic-bezier(0.22, 1, 0.36, 1),
                border-width 200ms ease;
  }

  .mononote-window.sidebar-collapsed .floating-sidebar {
    width: 0;
    opacity: 0;
    margin-right: -8px;
    border-width: 0;
    pointer-events: none;
  }

  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .sidebar-section-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--v-ink-3);
    padding: 0 8px 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-item {
    appearance: none;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--v-ink-2);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 8px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    cursor: pointer;
    text-align: left;
    transition: background 120ms ease, color 120ms ease;
  }

  .nav-item:hover {
    background: rgba(128, 118, 106, 0.10);
    color: var(--v-ink);
  }

  .nav-item.is-active {
    background: var(--v-accent-soft);
    color: var(--v-accent);
    font-weight: 600;
  }

  .nav-item-main {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
  }

  .nav-chevron {
    font-size: 10px;
    opacity: 0.65;
    width: 10px;
    text-align: center;
    flex-shrink: 0;
  }

  .nav-svg {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    opacity: 0.88;
  }

  .nav-item-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .nav-indent {
    padding-left: 24px;
    font-size: 12px;
  }

  .nav-badge {
    font-size: 10.5px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--v-accent-soft);
    color: var(--v-accent);
    font-weight: 600;
  }

  .tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 0 6px;
  }

  .side-tag {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(128, 118, 106, 0.10);
    color: var(--v-ink-2);
    border: 1px solid var(--v-border);
  }

  .sidebar-footer {
    padding: 8px 12px;
    border-top: 1px solid var(--v-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--v-ink-3);
  }

  .status-dot {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .status-dot::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--v-sage);
  }

  /* Main Warm Paper Canvas */
  .paper-canvas {
    flex: 1;
    min-width: 0;
    border-radius: 12px;
    background: var(--v-paper);
    border: 1px solid var(--v-border);
    box-shadow: var(--v-shadow-paper);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .canvas-header {
    height: 36px;
    flex-shrink: 0;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--v-border);
    font-size: 11.5px;
    color: var(--v-ink-3);
  }

  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow: hidden;
    white-space: nowrap;
  }

  .breadcrumbs strong {
    color: var(--v-ink-2);
    font-weight: 500;
  }

  .canvas-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mini-chip-btn {
    appearance: none;
    border: 1px solid var(--v-border);
    background: var(--v-card);
    color: var(--v-ink-2);
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 120ms ease, color 120ms ease;
  }
  .mini-chip-btn:hover {
    border-color: var(--v-accent);
    color: var(--v-accent);
  }

  .editor-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 18px 26px 24px;
    position: relative;
    user-select: text;
  }

  .editor-column {
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Editorial Header */
  .doc-hero {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 2px;
  }

  .doc-icon-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .doc-icon-badge {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: var(--v-accent-soft);
    color: var(--v-accent);
    display: grid;
    place-items: center;
  }

  .doc-badge {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--v-sage-soft);
    color: var(--v-sage);
  }

  .doc-title {
    font-family: "Noto Serif SC", "Songti SC", Georgia, var(--font-sans, sans-serif);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.015em;
    color: var(--v-ink);
  }

  .doc-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--v-ink-3);
  }

  .meta-tag {
    color: var(--v-accent);
    background: var(--v-accent-soft);
    padding: 1px 7px;
    border-radius: 5px;
    font-weight: 500;
  }

  /* Block Wrapper with Craft/Notion Hover Handle */
  .block-row {
    position: relative;
    padding: 2px 4px;
    margin: 0 -4px;
    border-radius: 8px;
    transition: background 120ms ease;
  }

  .block-row:hover {
    background: rgba(128, 118, 106, 0.045);
  }

  .block-handle {
    position: absolute;
    left: -17px;
    top: 4px;
    width: 14px;
    height: 18px;
    display: grid;
    place-items: center;
    color: var(--v-ink-3);
    font-size: 11px;
    opacity: 0;
    cursor: grab;
    transition: opacity 100ms ease;
    user-select: none;
  }

  .block-row:hover .block-handle {
    opacity: 0.75;
  }

  .callout-block {
    background: var(--v-card);
    border: 1px solid var(--v-border);
    border-left: 3px solid var(--v-accent);
    border-radius: 10px;
    padding: 10px 13px;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--v-ink-2);
  }

  .callout-icon {
    color: var(--v-accent);
    margin-top: 2px;
    flex-shrink: 0;
    display: inline-flex;
  }

  .block-h2 {
    font-size: 14.5px;
    font-weight: 650;
    color: var(--v-ink);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .block-h2::before {
    content: "";
    width: 3px;
    height: 13px;
    border-radius: 2px;
    background: var(--v-accent);
    opacity: 0.85;
  }

  .block-p {
    font-size: 13.5px;
    line-height: 1.68;
    color: var(--v-ink-2);
  }

  .inline-code {
    font-family: var(--font-mono, monospace);
    font-size: 11.5px;
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--v-code-bg);
    color: var(--v-accent);
    border: 1px solid var(--v-border);
  }

  /* Craft-style Nested Subpage Cards Grid */
  .subpage-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .subpage-card {
    appearance: none;
    border: 1px solid var(--v-border);
    background: var(--v-card);
    border-radius: 10px;
    padding: 10px 11px;
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-family: inherit;
    transition: transform 140ms ease, background 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
  }

  .subpage-card:hover {
    background: var(--v-card-hover);
    border-color: var(--v-border-strong);

  }

  document.getElementById('openCmdBtn').addEventListener('click', openCmd);
  btnCmd.addEventListener('click', () => {
    if (cmdBackdrop.classList.contains('is-open')) closeCmd();
    else openCmd();
  });
  cmdBackdrop.addEventListener('click', (e) => {
    if (e.target === cmdBackdrop) closeCmd();
  });
  cmdSearchInput.addEventListener('input', () => renderCommands(cmdSearchInput.value));

  document.addEventListener('click', () => {
    const slashMenu = document.getElementById('slashMenu');
    if (slashMenu) slashMenu.classList.remove('is-open');
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      openCmd();
    } else if (e.key === 'Escape') {
      closeCmd();
      const slashMenu = document.getElementById('slashMenu');
      if (slashMenu) slashMenu.classList.remove('is-open');
    }
  });

  renderTabs();
  renderSidebarState();
  renderPage();
</script>
</body>
</html>
